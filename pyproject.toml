[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learn-rag"
version = "0.1.0"
description = "可替换、可评测的 RAG 学习与实验框架"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# .env 自动加载
dotenv = ["python-dotenv>=1.0"]
# Chroma 持久化向量库
chroma = ["chromadb>=0.5"]
# 本地 embedding / CrossEncoder 精排
local = ["sentence-transformers>=2.7"]
# 文档解析：PDF / Word / PPT / Excel
parsing = [
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1",
]
# 高精度解析工具（体积大，按需安装）
mineru = ["mineru>=4.0,<5"]
docling = ["docling>=2.0"]
all = [
    "python-dotenv>=1.0",
    "chromadb>=0.5",
    "sentence-transformers>=2.7",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1",
]
dev = [
    "pytest>=8.0",
    "python-dotenv>=1.0",
    "chromadb>=0.5",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1",
]

[project.scripts]
learn-rag = "learn_rag.cli:main"

[tool.setuptools.packages.find]
include = ["learn_rag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
