# 每次推送和 PR：单元测试（3.10 / 3.12）、示例评测集的质量回归、前端类型检查与构建。
# 全部离线可跑：Hashing 向量、抽取式生成，不需要任何密钥。
# 用自己的文档和评测集做回归（需要 embedding / 大模型密钥）见 README“质量回归”。
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m unittest discover tests

  quality:
    # 示例评测集和 tests/baselines/sample_eval.json 比较，任何质量指标掉了超过 0.02 就失败。
    # 有意改变效果时，本地重跑同一条命令并加 --save-baseline tests/baselines/sample_eval.json，连同代码一起提交
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python scripts/make_sample_data.py
      - run: >
          learn-rag eval --dataset jsonl --qa data/sample_qa.jsonl --corpus data/sample_corpus.jsonl
          --baseline tests/baselines/sample_eval.json --out runs/ci_eval.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: runs/

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
